spring.application.name=Ecommerce

app.admin.password=${ADMIN_PASSWORD}

# JWT Configuration
jwt.secret=${JWT_SECRET_KEY}
jwt.expiration-ms=900000
jwt.refresh-expiration-ms=604800000


#POSTGRES
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Batch lazy loads into IN-clause queries instead of one query per row (N+1 safety net)
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}

# CORS - comma-separated origins allowed to call the API from a browser
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# File uploads
app.upload.dir=${UPLOAD_DIR:uploads/products}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Swagger / OpenAPI
springdoc.swagger-ui.operationsSorter=method